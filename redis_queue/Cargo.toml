[package]
name = "redis_queue"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
redis = {version="1.7.0" ,features=["tokio-comp"]}
reqwest = { version = "0.12", features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
store = { path = "../store" }
tokio = {version="1.53.1", features = ["full"]}
uuid = {version = "1.26.0", features = ["v4"]}
